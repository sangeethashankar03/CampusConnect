<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusConnect - Register</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div class="container">
    <h1>CampusConnect</h1>
    <p>Secure communication and collaboration platform for students.</p>

    <div class="card">
      <h2>Register</h2>
      <form id="register-form">
        <label for="email">University email</label>
        <input type="email" id="email" placeholder="you@dbs.ie" required>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••" required>

        <button type="submit" style="width: 100%; margin-bottom: 16px;">Create account</button>
      </form>
      <p style="text-align: center; font-size: 0.9rem;">
        Already have an account? <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Log in</a>
      </p>
      <p id="register-status"></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const status = document.getElementById("register-status");

      if (!isValidEmail(email) || !isValidUsername(username) || !isValidPassword(password)) {
        status.textContent = "Please check your email, username and password format.";
        return;
      }

      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({ email, username, password }),
        });
        status.textContent = "Registered! You can now log in.";
      } catch (err) {
        status.textContent = err.message;
      }
    });
  </script>
</body>
</html>
