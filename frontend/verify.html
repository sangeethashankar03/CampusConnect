<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusConnect - Verify Email</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div class="container">
    <h1>Campus<span class="brand-connect">Connect</span></h1>
    <div class="card">
      <h2>Email verification</h2>
      <p id="verify-status">Verifying...</p>
      <p><a href="login.html" style="color: var(--color-primary); font-weight: 600;">Go to login</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const status = document.getElementById("verify-status");
      if (!token) { status.textContent = "Missing verification token."; return; }
      try {
        const data = await apiFetch("/auth/verify", { method: "POST", body: JSON.stringify({ token }) });
        status.textContent = data.message;
      } catch (err) {
        status.textContent = err.message;
      }
    })();
  </script>
</body>
</html>
