<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusConnect - Login</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div class="container">
    <h1>CampusConnect</h1>
    <p>Secure communication and collaboration platform for students.</p>

    <div class="card">
      <h2>Log in</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@dbs.ie" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••" required>

        <button type="submit" style="width: 100%; margin-bottom: 16px;">Log in</button>
      </form>
      <p style="text-align: center; font-size: 0.9rem;">
        New here? <a href="register.html" style="color: var(--color-primary); font-weight: 600;">Create an account</a>
      </p>
      <p id="login-status"></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/crypto.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const status = document.getElementById("login-status");

      try {
        const data = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        setToken(data.access_token);

        const encPair = await generateEncryptionKeyPair();
        const signPair = await generateSigningKeyPair();
        const encryptionPublicPem = await exportPublicKeyPem(encPair.publicKey);
        const signingPublicPem = await exportPublicKeyPem(signPair.publicKey);

        // Save private keys in sessionStorage so chat.html can reuse the same
        // key pair. Cleared automatically when the tab/browser session closes —
        // private keys are never sent to the server or stored permanently.
        const encryptionPrivatePem = await exportPrivateKeyPem(encPair.privateKey);
        const signingPrivatePem = await exportPrivateKeyPem(signPair.privateKey);
        sessionStorage.setItem("enc_private_key", encryptionPrivatePem);
        sessionStorage.setItem("sign_private_key", signingPrivatePem);

        await apiFetch("/keys/register", {
          method: "POST",
          body: JSON.stringify({
            encryption_key: encryptionPublicPem,
            signing_key: signingPublicPem,
          }),
        });

        status.textContent = "Logged in and keys registered.";
        window.location.href = "messages.html";
      } catch (err) {
        status.textContent = err.message;
      }
    });
  </script>
</body>
</html>
